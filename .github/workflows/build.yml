name: Build AetherMC Pause Menu Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Verify JAR exists
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs
          test -n "$(find build/libs -maxdepth 1 -type f -name 'AetherMC-PauseMenu-*.jar' ! -name '*-sources.jar' -print -quit)"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AetherMC-PauseMenu-JAR
          path: |
            build/libs/AetherMC-PauseMenu-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
